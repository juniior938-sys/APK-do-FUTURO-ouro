<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 8"/>
  
  <!-- Golden Bullion / Shield Center -->
  <path d="M256 90 L390 140 V260 C390 345 330 415 256 438 C182 415 122 345 122 260 V140 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <path d="M256 115 L368 158 V258 C368 330 318 390 256 410 C194 390 144 330 144 258 V158 Z" fill="#020617" opacity="0.88"/>

  <!-- Candlesticks inside shield -->
  <!-- Candle 1 (Bullish green) -->
  <rect x="186" y="240" width="22" height="70" rx="3" fill="#10b981"/>
  <line x1="197" y1="218" x2="197" y2="330" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Candle 2 (Bearish/Correction) -->
  <rect x="222" y="270" width="22" height="40" rx="3" fill="#f43f5e"/>
  <line x1="233" y1="252" x2="233" y2="322" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>

  <!-- Candle 3 (Major Bullish breakout) -->
  <rect x="258" y="190" width="22" height="110" rx="3" fill="#10b981"/>
  <line x1="269" y1="168" x2="269" y2="320" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Candle 4 (HFT continuation) -->
  <rect x="294" y="170" width="22" height="85" rx="3" fill="#fbbf24"/>
  <line x1="305" y1="150" x2="305" y2="280" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Dynamic Zap / Lightning Bolt / HFT Flash -->
  <polygon points="266,130 240,210 262,210 236,290 286,200 264,200" fill="#ffffff" filter="drop-shadow(0 0 8px rgba(251,191,36,0.8))"/>

  <!-- Text / Badge -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f59e0b" letter-spacing="4">HFT 24/5</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">GOLD SCALPER AI</text>
</svg>
